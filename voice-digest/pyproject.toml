[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-digest"
version = "0.1.0"
description = "Local-first voice notes: record, transcribe, summarize with Claude, and expose to Claude Code over MCP."
requires-python = ">=3.10"
dependencies = [
  "anthropic>=1.8",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "pydantic>=2",
  "mcp>=2.2,<3",
]

[project.optional-dependencies]
# Local speech-to-text. Kept optional because it pulls in a large model runtime.
transcribe = ["faster-whisper>=1.0"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
voice-digest = "voice_digest.server:main"
voice-digest-mcp = "voice_digest.mcp_server:main"

[tool.setuptools]
packages = ["voice_digest"]

[tool.setuptools.package-data]
voice_digest = ["static/*"]
